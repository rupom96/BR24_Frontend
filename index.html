    function loadApiSettings() {
      try {
        // Synchronous XMLHttpRequest to read apiConfig.json from the public folder
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/apiConfig.json', false); // 'false' makes the request synchronous
        xhr.send(null);

        if (xhr.status === 200) {
          const settings = JSON.parse(xhr.responseText);
          window.API_BASE_URL = settings.API_BASE_URL;
          window.BR2_URL = settings.BR2_URL;
          window.BR3_API_URL = settings.BR3_API_URL;
          window.BR3_FN_URL = settings.BR3_FN_URL;
          // window.BR2_Report_URL=settings.BR2_Report_URL;
          console.log("window.API_BASE_URL");
          console.log(window.API_BASE_URL);
          console.log("window.BR2_URL");
          console.log(window.BR2_URL);
          console.log("window.BR3_API_URL");
          console.log(window.BR3_API_URL);
          console.log("window.BR3_FN_URL");
          console.log(window.BR3_FN_URL);
          // console.log("window.BR2_Report_URL");
          // console.log(window.BR2_Report_URL);

        } else {
          console.error('Failed to load API settings. Status:', xhr.status);
        }
      } catch (error) {
        console.error('Failed to load API settings:', error);
      }
    }


     loadApiSettings();

  </script>
